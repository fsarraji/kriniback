name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: car_rental_backend.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pyflakes
      - name: "Lint (erreurs réelles uniquement)"
        run: |
          if python -m pyflakes $(git ls-files '*.py' | grep -v migrations) | grep -E "undefined name|syntax error|invalid syntax"; then exit 1; fi
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test
